<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#130c08" />
    <title>Wahl — offline</title>
    <style>
      :root { color-scheme: dark; background: #130c08; color: #eadcc8; font: 16px/1.6 Georgia, serif; }

      main { max-width: 34rem; border: 1px solid #7b5528; border-radius: 1rem; padding: 2rem; background: #1b100b; box-shadow: 0 1rem 3rem #0008; }
      h1 { margin: 0 0 .5rem; color: #c99a3c; font-size: 2.5rem; font-style: italic; }
      p { margin: .5rem 0 0; }
      small { color: #b8a58f; }
    </style>
  </head>
  <body><main><h1>Wahl.</h1><p>The wall is taking a quiet pause.</p><small>Reconnect to see the latest entries. Private thoughts and conversations are never stored for offline use.</small></main></body>
